{% extends "base.html" %}{% block title %}Sign in{% endblock %}
{% block body %}
<div class="card" style="max-width:400px;margin:56px auto">
<h1>Sign in</h1><p class="sub">Trainer video assessment</p>
{% if error %}<div class="banner alert"><strong>{{ error }}</strong></div>{% endif %}
<form method="post" action="/login">
<label>Email</label><input type="email" name="email" autocomplete="username" required autofocus>
<label>Password</label><input type="password" name="password" autocomplete="current-password" required>
<p style="margin-top:20px"><button style="width:100%">Sign in</button></p></form>
<p class="small">Access is limited to authorised staff. All activity is logged.</p></div>
{% endblock %}
