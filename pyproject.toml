[project]
name = "trainer-assessment"
version = "0.1.0"
description = "AI trainer video assessment system (internal tool)"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "sqlalchemy>=2.0",
  "jinja2>=3.1",
  "python-multipart>=0.0.9",
  "itsdangerous>=2.2",
  "jsonschema>=4.21",
  "reportlab>=4.2",
  "openpyxl>=3.1",
  "lxml>=5.0",
]

[project.optional-dependencies]
# Live mode only: Gemini SDK, GCS, PostgreSQL driver. Not needed for mock mode.
live = [
  "google-genai>=2.34",
  "google-cloud-storage>=2.16",
  "psycopg[binary]>=3.2",
]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.6"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008", "E501"]  # B008: FastAPI Depends() idiom

[tool.pytest.ini_options]
testpaths = ["tests"]
